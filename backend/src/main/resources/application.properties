spring.application.name=leave-management
server.port=8080

# ---------- Database (H2 in-memory, default) ----------
spring.datasource.url=jdbc:h2:mem:leavedb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
# H2 console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:leavedb)

# ---------- JPA / Hibernate ----------
# update = create/alter tables automatically from entities (OK for learning; real projects use Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Logging ----------
logging.level.com.company.leave=DEBUG

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
